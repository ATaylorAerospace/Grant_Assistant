name: CI

# Catches errors in minutes on every push/PR instead of after a 45-minute
# CodeBuild deploy. Nothing here touches AWS.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-typecheck:
    name: Amplify backend (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.ci.json

  python-syntax:
    name: Lambda + agent sources compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile every handler and agent
        run: |
          python -m compileall -q \
            $(git ls-files 'amplify/functions/*/handler.py' 'bc/*/agent.py' 'bc/*/*.py' 'amplify/custom/*.py' 'python/*.py')

  lambda-tests:
    name: Lambda unit tests
    runs-on: ubuntu-latest
    # The four existing suites (kb-*) predate recent handler changes and fail on
    # signature/behaviour drift. They run so the drift is visible on every PR, but
    # do not block merges until they are brought back in sync. Flip this to false
    # once ./scripts/test-lambdas.sh passes locally.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest boto3 pypdf
      - run: ./scripts/test-lambdas.sh

  agent-shared-tests:
    name: Agent shared package (connectors, domain config)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest boto3 httpx
      - run: python -m pytest bc/common/tests -q

  frontend-build:
    name: React app builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: react-aws/package-lock.json
      - name: Stub amplify_outputs.json (real one comes from a deployed stack)
        run: |
          cat > react-aws/src/amplify_outputs.json <<'EOF'
          { "version": "1", "auth": { "aws_region": "us-east-1", "user_pool_id": "us-east-1_ci", "user_pool_client_id": "ci" },
            "data": { "aws_region": "us-east-1", "url": "https://ci.appsync-api.us-east-1.amazonaws.com/graphql", "default_authorization_type": "AMAZON_COGNITO_USER_POOLS", "authorization_types": [] } }
          EOF
      - run: npm ci --no-audit --no-fund --legacy-peer-deps
        working-directory: react-aws
      - run: CI=false npm run build
        working-directory: react-aws
